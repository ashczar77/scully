[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "scully"
version = "0.1.0"
description = "Safe incident reproduction from sanitized evidence"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = [
    "contree-sdk==0.3.3",
    "openai==3.8.0",
    "tavily-python==0.8.1",
]

[project.scripts]
scully-preflight = "scully.preflight:main"
scully-probe-nemotron = "scully.probes.nemotron:main"

[tool.setuptools.packages.find]
where = ["src"]
